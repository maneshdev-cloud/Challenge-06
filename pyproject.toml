[project]
name = "prana-ai"
version = "1.0.0"
description = "Neuro-Symbolic Pan-India Household Smog & Exposure Planner"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["backend"]
branch = true
omit = ["backend/tests/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
