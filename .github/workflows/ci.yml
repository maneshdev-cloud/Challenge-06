name: CI Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Lint, Complexity, Pylint, Typecheck, Smoke & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dev dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      - name: Ruff format, lint, complexity & bugbear checks
        run: python -m ruff format --check backend scripts && python -m ruff check backend scripts && python -m ruff check --select C901,B backend

      - name: Raw Pylint quality check (10.00/10 gate)
        run: python -m pylint backend/*.py

      - name: Bandit static security check
        run: python -m bandit -r backend -x backend/tests -q

      - name: Dependency vulnerability audit (pip-audit full tree)
        run: python -m pip_audit -r backend/requirements.txt

      - name: Mypy static type check
        run: python -m mypy backend

      - name: Pytest suite & source coverage gate (>=90%)
        run: python -m pytest -v --cov --cov-report=term-missing --cov-fail-under=90 backend/tests

      - name: API contract & security smoke script
        run: python scripts/smoke.py

  frontend:
    name: Frontend Audit, ESLint, Vitest Coverage, Build & Bundle Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm run audit:deps

      - name: ESLint & JSX Accessibility check
        run: npm run lint

      - name: Vitest unit tests & coverage gate
        run: npm run test:coverage

      - name: Production Vite build
        run: npm run build

      - name: Gzipped bundle budget & lazy Recharts check
        run: npm run bundle:check
