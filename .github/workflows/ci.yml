name: CI Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend Lint, Typecheck & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dev dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt

      - name: Ruff lint check
        run: python -m ruff check backend

      - name: Mypy static type check
        run: python -m mypy backend

      - name: Pytest suite
        run: python -m pytest -v backend/tests

  frontend:
    name: Frontend ESLint, Vitest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint & JSX Accessibility check
        run: npm run lint

      - name: Vitest unit tests
        run: npm run test

      - name: Production Vite build
        run: npm run build
